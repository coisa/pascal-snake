name: Pascal Snake

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: snake-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile, test rules and exercise both interfaces
        run: make test
      - name: Verify the runtime package
        run: make image smoke
      - name: Verify Compose and whitespace
        run: |
          docker compose config --quiet
          git diff --check
